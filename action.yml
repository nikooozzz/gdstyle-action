name: 'gdstyle-action'
description: 'Runs gdstyle linting, formatting checks, auto-fixes, and PR summary reports'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Target directory to check or format'
    required: false
    default: '.'
  check-lint:
    description: 'Run gdstyle lint check'
    required: false
    default: 'true'
  check-format:
    description: 'Run gdstyle format check'
    required: false
    default: 'true'
  auto-fix:
    description: 'Automatically run fixes and commit back to branch'
    required: false
    default: 'false'
  commit-message:
    description: 'Commit message for auto-fix commits'
    required: false
    default: 'style: auto-fix GDScript formatting'
  post-comment:
    description: 'Post or update a summary report comment on Pull Requests'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install gdstyle Binary
      uses: taiki-e/install-action@v2
      with:
        tool: gdstyle

    - name: Run gdstyle Auto-Fix
      if: inputs.auto-fix == 'true'
      shell: bash
      run: gdstyle fmt ${{ inputs.path }}

    - name: Commit Auto-Fixes
      if: inputs.auto-fix == 'true'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: ${{ inputs.commit-message }}
        file_pattern: '${{ inputs.path }}'
        skip_push: ${{ env.ACT == 'true' }}

    - name: Run gdstyle Lint Check
      if: inputs.check-lint == 'true'
      shell: bash
      run: |
        set +e
        gdstyle check ${{ inputs.path }} > gdstyle_lint_report.txt 2>&1
        echo "LINT_EXIT=$?" >> $GITHUB_ENV
        set -e

    - name: Run gdstyle Format Check
      if: inputs.check-format == 'true'
      shell: bash
      run: |
        set +e
        gdstyle fmt --check ${{ inputs.path }} > gdstyle_fmt_report.txt 2>&1
        echo "FMT_EXIT=$?" >> $GITHUB_ENV
        set -e

    - name: Compose Summary Report
      if: always()
      shell: bash
      run: |
        REPORT_FILE="summary_report.md"
        
        echo "### GDScript Quality Report" > $REPORT_FILE
        if [ "${{ inputs.check-lint }}" = "true" ]; then
          echo "#### Lint Verification" >> $REPORT_FILE
          if [ -s gdstyle_lint_report.txt ]; then
            echo '```text' >> $REPORT_FILE
            cat gdstyle_lint_report.txt >> $REPORT_FILE
            echo '```' >> $REPORT_FILE
          else
            echo "All GDScript files passed lint checks." >> $REPORT_FILE
          fi
        fi

        if [ "${{ inputs.check-format }}" = "true" ]; then
          echo "#### Format Verification" >> $REPORT_FILE
          if [ -s gdstyle_fmt_report.txt ]; then
            echo '```text' >> $REPORT_FILE
            cat gdstyle_fmt_report.txt >> $REPORT_FILE
            echo '```' >> $REPORT_FILE
          else
            echo "All files adhere to formatting standards." >> $REPORT_FILE
          fi
        fi

        cat $REPORT_FILE >> $GITHUB_STEP_SUMMARY
        
        {
          echo "SUMMARY_BODY<<EOF"
          cat $REPORT_FILE
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Post PR Comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: ${{ env.SUMMARY_BODY }}

    - name: Evaluate Exit Code
      shell: bash
      run: |
        LINT="${LINT_EXIT:-0}"
        FMT="${FMT_EXIT:-0}"
        if [ "$LINT" -gt 0 ] || [ "$FMT" -gt 0 ]; then
          echo "gdstyle checks failed."
          exit 1
        fi
