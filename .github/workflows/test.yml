name: CI & Action Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  test-composite-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test valid GDScript check
        uses: ./
        with:
          path: './test/fixtures/valid'
          check-lint: 'true'
          check-format: 'true'
          post-comment: 'false'

      - name: Test invalid GDScript check expected failure
        id: test_failure
        continue-on-error: true
        uses: ./
        with:
          path: './test/fixtures/invalid'
          check-lint: 'true'
          check-format: 'true'
          post-comment: 'false'

      - name: Verify failure step was triggered
        shell: bash
        run: |
          if [ "${{ steps.test_failure.outcome }}" != "failure" ]; then
            echo "Expected action to fail on broken formatting, but it passed."
            exit 1
          fi
          echo "Action correctly caught formatting errors."

      - name: Test auto-fix behavior
        uses: ./
        with: 
          path: './test/fixtures/invalid'
          auto-fix: 'true'
          post-comment: 'false'

      - name: Verify auto-fix fixed formatting
        shell: bash
        run: |
          gdstyle fmt --check ./test/fixtures/invalid
      
      - name: Reset fixtures git status
        run: git checkout -- test/fixtures/
